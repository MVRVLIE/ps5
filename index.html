<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#120f1c">
<meta name="description" content="Формула симпатии — новелла-мессенджер: решай примеры вместе с Никой, прокачивай симпатию, собирай её фото.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Формула симпатии</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="phone" id="phone">

  <!-- ЭКРАН: чат -->
  <section class="view view-chat active" id="view-chat">
    <header class="chat-head">
      <div class="avatar" id="head-avatar"></div>
      <div class="chat-who">
        <b>Ника</b>
        <span id="head-status">в сети</span>
      </div>
      <div class="affection" id="affection" title="Симпатия">
        <div class="aff-bar"><i id="aff-fill"></i></div>
        <span id="aff-lvl">ур. 1</span>
      </div>
      <button id="btn-mute" class="icon-btn" aria-label="Звук">♪</button>
    </header>

    <div class="thread" id="thread"></div>

    <footer class="composer" id="composer"></footer>
  </section>

  <!-- ЭКРАН: галерея -->
  <section class="view view-gallery" id="view-gallery">
    <header class="plain-head">
      <b>Галерея</b>
      <span id="gallery-count">0 / 0</span>
    </header>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ЭКРАН: профиль -->
  <section class="view view-profile" id="view-profile">
    <header class="plain-head"><b>Профиль</b></header>
    <div class="profile" id="profile"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="chat">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8a8 8 0 0 1-8.6 8 8.8 8.8 0 0 1-3.4-.7L3.5 20.5l1.8-4.4a7.9 7.9 0 0 1-1.3-4.3 8 8 0 0 1 8.1-7.8 8 8 0 0 1 8.4 7.8z"/></svg></i>
      <span>Чат</span><em class="dot" id="dot-chat" hidden></em>
    </button>
    <button class="tab" data-view="gallery">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m20.5 16-4.7-4.6L6 19.5"/></svg></i>
      <span>Галерея</span><em class="dot" id="dot-gallery" hidden></em>
    </button>
    <button class="tab" data-view="profile">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.9"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></i>
      <span>Профиль</span>
    </button>
  </nav>

  <!-- Просмотр фото -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-card" id="lb-card"></div>
    <div class="lb-cap" id="lb-cap"></div>
    <button class="lb-close" id="lb-close">Закрыть</button>
  </div>

  <!-- Всплывашки -->
  <div class="toast" id="toast"></div>
  <div class="levelup" id="levelup" hidden></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
